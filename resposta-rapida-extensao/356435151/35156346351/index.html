<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabéns pela compra</title>
  <style>
    :root { --purple: #6957e8; --purple-dark: #5040c3; --ink: #201f36; --muted: #6d6883; }
    * { box-sizing: border-box; }
    body {
      display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px;
      color: var(--ink); background: radial-gradient(circle at top, #eeeaff 0, #f8f7ff 42%, #fff 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 530px); padding: 42px 34px; border: 1px solid #e3dffc; border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 24px 60px rgba(55, 43, 122, .15); text-align: center; }
    .icon { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 19px; border-radius: 18px; color: #fff; background: linear-gradient(135deg, #6957e8, #a47dff); font-size: 28px; box-shadow: 0 12px 25px rgba(105,87,232,.25); }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.045em; line-height: 1.1; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .serial { margin: 27px 0 14px; padding: 15px; border: 1px dashed #b8aeec; border-radius: 13px; color: var(--purple-dark); background: #f5f3ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 750; line-height: 1.55; overflow-wrap: anywhere; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 12px; color: #fff; background: var(--purple); font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(105,87,232,.22); transition: transform .15s ease, background .15s ease; }
    button:hover { background: var(--purple-dark); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #c8c0ff; outline-offset: 3px; }
    .hint { margin-top: 15px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="icon">✓</div>
    <h1>Parabéns pela compra!</h1>
    <p>Copie o seu serial aqui e use-o para ativar a extensão.</p>
    <div id="serial" class="serial">Hci288tCHVb7adFueonl08ugMU3psDa7vuqgfCn6</div>
    <button id="copyButton" type="button">Copiar</button>
    <p id="hint" class="hint">Guarde este serial em um local seguro.</p>
  </main>

  <script>
    const serial = document.getElementById("serial").textContent.trim();
    const button = document.getElementById("copyButton");
    const hint = document.getElementById("hint");

    async function copySerial() {
      try {
        await navigator.clipboard.writeText(serial);
      } catch {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = serial;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        document.execCommand("copy");
        temporaryInput.remove();
      }
      button.textContent = "Serial copiado!";
      hint.textContent = "Agora, cole o serial na tela de ativação da extensão.";
      setTimeout(() => { button.textContent = "Copiar"; }, 2500);
    }

    button.addEventListener("click", copySerial);
  </script>
</body>
</html>
