<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Administração</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-black p-5 text-white"><main class="mx-auto max-w-6xl"><header class="mb-5 flex items-center justify-between"><div><h1 class="text-3xl font-bold text-[#d4af37]">PDV - Pro · Administração</h1><p class="text-zinc-400">Solicitações e clientes</p></div><button id="sair" class="rounded bg-zinc-800 px-4 py-2">Sair</button></header><input id="busca" placeholder="Pesquisar nome, e-mail ou WhatsApp" class="mb-5 w-full rounded bg-zinc-900 p-3"><div id="lista" class="space-y-3"></div></main><script type="module">import{auth,db,functions}from'./firebase-config.js';import{sair}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,onSnapshot,query,orderBy}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{httpsCallable}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js';let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.querySelector('#busca').value.toLowerCase();document.querySelector('#lista').innerHTML=rows.filter(x=>[x.name,x.email,x.whatsapp].join(' ').toLowerCase().includes(q)).map(x=>`<article class="rounded-xl border border-zinc-800 bg-zinc-950 p-4"><div class="flex flex-wrap justify-between gap-3"><div><b class="text-lg text-[#d4af37]">${esc(x.name)}</b><p>${esc(x.email)} · ${esc(x.whatsapp)}</p><p class="text-sm text-zinc-400">Status: ${esc(x.status)} · Solicitação: ${x.createdAt?.toDate?.().toLocaleString('pt-BR')||'—'}<br>UID: ${esc(x.uid||'—')} · Aprovado: ${x.approvedAt?.toDate?.().toLocaleString('pt-BR')||'—'} · Bloqueado: ${x.blockedAt?.toDate?.().toLocaleString('pt-BR')||'—'}</p></div><div class="flex gap-2"><button data-a="approve" data-id="${x.id}" class="rounded bg-[#d4af37] px-3 py-2 font-bold text-black">Aprovar</button><button data-a="block" data-id="${x.id}" class="rounded bg-red-800 px-3 py-2">Bloquear</button><button data-a="activate" data-id="${x.id}" class="rounded bg-green-800 px-3 py-2">Desbloquear</button></div></div></article>`).join('')||'<p class="text-zinc-400">Nenhum cliente encontrado.</p>'}onAuthStateChanged(auth,async u=>{if(!u)return location.replace('./login.html');let t=await u.getIdTokenResult(true);if(!t.claims.admin&&u.email?.toLowerCase()==='mayconbrown083@gmail.com'){await httpsCallable(functions,'bootstrapOwnerAdmin')({});await u.getIdToken(true);t=await u.getIdTokenResult(true)}if(!t.claims.admin){await sair();return}onSnapshot(query(collection(db,'accessRequests'),orderBy('createdAt','desc')),s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));render()})});document.querySelector('#busca').oninput=render;document.querySelector('#lista').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{await httpsCallable(functions,b.dataset.a==='approve'?'approveCustomer':'setCustomerStatus')({requestId:b.dataset.id,status:b.dataset.a==='block'?'bloqueado':'ativo'});alert('Operação concluída.')}catch(x){alert(x.message)}};document.querySelector('#sair').onclick=sair;</script></body></html>
