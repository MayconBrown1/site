<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Administração</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-black p-5 text-white"><main class="mx-auto max-w-6xl"><header class="mb-5 flex items-center justify-between"><div><h1 class="text-3xl font-bold text-[#d4af37]">PDV - Pro · Administração</h1><p class="text-zinc-400">Proprietário: Maycon Brown</p></div><button id="sair" class="rounded bg-zinc-800 px-4 py-2">Sair</button></header><input id="busca" placeholder="Pesquisar nome, e-mail ou WhatsApp" class="mb-5 w-full rounded bg-zinc-900 p-3"><p id="m" class="mb-3 text-sm text-red-300"></p><div id="lista" class="space-y-3"></div></main><script type="module">import{auth,db}from'./firebase-config.js';import{sair}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,onSnapshot,query,orderBy,doc,writeBatch,serverTimestamp,deleteDoc}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const OWNER='mayconbrown083@gmail.com',lista=document.querySelector('#lista'),busca=document.querySelector('#busca'),m=document.querySelector('#m');let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=busca.value.toLowerCase();lista.innerHTML=rows.filter(x=>[x.name,x.email,x.whatsapp].join(' ').toLowerCase().includes(q)).map(x=>`<article class="rounded-xl border border-zinc-800 bg-zinc-950 p-4"><div class="flex flex-wrap justify-between gap-3"><div><b class="text-lg text-[#d4af37]">${esc(x.name)}</b><p>${esc(x.email)} · ${esc(x.whatsapp)}</p><p class="text-sm text-zinc-400">Status: ${esc(x.status)} · Solicitação: ${x.createdAt?.toDate?.().toLocaleString('pt-BR')||'—'}<br>UID: ${esc(x.uid||'—')} · Aprovado: ${x.approvedAt?.toDate?.().toLocaleString('pt-BR')||'—'} · Bloqueado: ${x.blockedAt?.toDate?.().toLocaleString('pt-BR')||'—'}</p></div><div class="flex flex-wrap gap-2"><button data-a="ativo" data-id="${x.id}" data-u="${x.uid}" class="rounded bg-[#d4af37] px-3 py-2 font-bold text-black">Aprovar / Ativar</button><button data-a="bloqueado" data-id="${x.id}" data-u="${x.uid}" class="rounded bg-red-800 px-3 py-2">Bloquear</button><button data-a="excluir" data-id="${x.id}" data-u="${x.uid}" data-n="${esc(x.name)}" class="rounded bg-zinc-700 px-3 py-2">Excluir</button></div></div></article>`).join('')||'<p class="text-zinc-400">Nenhuma solicitação encontrada.</p>'}onAuthStateChanged(auth,u=>{if(!u)return location.replace('./login.html');if(u.email?.toLowerCase()!==OWNER){m.textContent='Apenas o proprietário pode acessar esta página.';return}onSnapshot(query(collection(db,'accessRequests'),orderBy('createdAt','desc')),s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>m.textContent=e.message)});busca.oninput=render;lista.onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.a==='excluir'){if(!confirm(`Excluir os dados e revogar o acesso de ${b.dataset.n}? A conta Authentication deverá ser removida manualmente no Firebase Console.`))return;const tasks=[deleteDoc(doc(db,'accessRequests',b.dataset.id))];if(b.dataset.u){tasks.push(deleteDoc(doc(db,'users',b.dataset.u,'app','state')),deleteDoc(doc(db,'users',b.dataset.u)))}await Promise.all(tasks);m.className='mb-3 text-sm text-green-300';m.textContent='Dados excluídos e acesso revogado.';return}const status=b.dataset.a,now=serverTimestamp(),batch=writeBatch(db);batch.update(doc(db,'accessRequests',b.dataset.id),{status,approvedAt:status==='ativo'?now:null,blockedAt:status==='bloqueado'?now:null});batch.update(doc(db,'users',b.dataset.u),{status,approvedAt:status==='ativo'?now:null,blockedAt:status==='bloqueado'?now:null});await batch.commit()}catch(x){console.error(x);m.className='mb-3 text-sm text-red-300';m.textContent=x.message}};document.querySelector('#sair').onclick=sair;</script></body></html>
