<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Entrar</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050505}.gold{color:#d4af37}.card{border:1px solid #3d3314}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#050505"><script src="./pwa-install.js"></script></head>
<body class="min-h-screen grid place-items-center p-5 text-white"><main class="card w-full max-w-md rounded-2xl bg-zinc-950 p-7 shadow-2xl"><h1 class="text-3xl font-bold gold">PDV - Pro</h1><p class="mb-6 mt-1 text-zinc-400">Acesso premium ao seu caixa.</p><form id="form-login" class="space-y-4"><input id="email" type="email" required placeholder="E-mail" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-3"><input id="senha" type="password" required placeholder="Senha" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-3"><button type="submit" class="w-full rounded-lg bg-[#d4af37] p-3 font-bold text-black">Entrar</button></form><div class="mt-5 flex justify-between text-sm"><button id="reset" type="button" class="gold">Esqueci minha senha</button><a href="./cadastro.html" class="gold">Solicitar acesso / Assinar agora</a></div><p id="mensagem" class="mt-4 text-sm text-red-300" role="alert"></p></main><script type="module">import{entrar,recuperarSenha}from'./auth.js';const form=document.querySelector('#form-login'),email=document.querySelector('#email'),senha=document.querySelector('#senha'),reset=document.querySelector('#reset'),m=document.querySelector('#mensagem');form.addEventListener('submit',async e=>{e.preventDefault();m.className='mt-4 text-sm text-zinc-300';m.textContent='Verificando acesso...';try{await entrar(email.value.trim(),senha.value)}catch(x){console.error(x);m.className='mt-4 text-sm text-red-300';m.textContent=x.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':(x.message||'Não foi possível entrar.')}});reset.addEventListener('click',async()=>{const address=prompt('Informe seu e-mail:');if(!address)return;try{await recuperarSenha(address.trim());m.className='mt-4 text-sm text-green-300';m.textContent='Enviamos o link de recuperação para seu e-mail.'}catch(x){console.error(x);m.className='mt-4 text-sm text-red-300';m.textContent=x.message||'Não foi possível enviar o e-mail de recuperação.'}});</script></body></htm
