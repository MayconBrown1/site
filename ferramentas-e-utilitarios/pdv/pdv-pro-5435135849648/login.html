<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Entrar</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050505}.gold{color:#d4af37}.card{border:1px solid #3d3314}</style></head><body class="min-h-screen grid place-items-center p-5 text-white"><main class="card w-full max-w-md rounded-2xl bg-zinc-950 p-7 shadow-2xl"><h1 class="text-3xl font-bold gold">PDV - Pro</h1><p class="mb-6 mt-1 text-zinc-400">Acesso premium ao seu caixa.</p><form id="form-login" class="space-y-4"><input id="email" type="email" required placeholder="E-mail" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-3"><input id="senha" type="password" required placeholder="Senha" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-3"><button class="w-full rounded-lg bg-[#d4af37] p-3 font-bold text-black">Entrar</button></form><div class="mt-5 flex justify-between text-sm"><button id="reset" class="gold">Esqueci minha senha</button><a href="./cadastro.html" class="gold">Solicitar acesso / Assinar agora</a></div><p id="mensagem" class="mt-4 text-sm text-red-300"></p></main><script type="module">import { entrar,recuperarSenha } from './auth.js';const m=document.querySelector('#mensagem');form-login.onsubmit=async e=>{e.preventDefault();m.textContent='';try{await entrar(email.value,senha.value)}catch(x){m.textContent=x.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':x.message}};reset.onclick=async()=>{const e=prompt('Informe seu e-mail:');if(!e)return;try{await recuperarSenha(e);m.className='mt-4 text-sm text-green-300';m.textContent='Enviamos o link de recuperação para seu e-mail.'}catch(x){m.textContent=x.message}}</script></body></html>
