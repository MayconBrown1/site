<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Assinatura</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen grid place-items-center bg-black p-5 text-white"><main class="w-full max-w-md rounded-2xl border border-[#3d3314] bg-zinc-950 p-7"><h1 class="text-3xl font-bold text-[#d4af37]">Assine o PDV - Pro</h1><p class="my-3 text-sm text-zinc-400">Sua solicitação será analisada após o pagamento. A senha desejada não é armazenada; quando o acesso for aprovado, use a recuperação de senha para defini-la.</p><form id="pedido" class="space-y-3"><input id="nome" required placeholder="Nome completo" class="w-full rounded bg-zinc-900 p-3"><input id="email" type="email" required placeholder="E-mail" class="w-full rounded bg-zinc-900 p-3"><input id="whatsapp" required placeholder="WhatsApp / telefone" class="w-full rounded bg-zinc-900 p-3"><input id="senha" type="password" minlength="6" required placeholder="Senha desejada (mín. 6)" class="w-full rounded bg-zinc-900 p-3"><button class="w-full rounded bg-[#d4af37] p-3 font-bold text-black">ASSINAR AGORA</button></form><p id="m" class="mt-4 text-sm"></p><a href="login.html" class="mt-4 inline-block text-sm text-[#d4af37]">Voltar ao login</a></main><script type="module">import {db,PAYMENT_URL} from './firebase-config.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';pedido.onsubmit=async e=>{e.preventDefault();m.textContent='';try{const r=await addDoc(collection(db,'accessRequests'),{name:nome.value.trim(),email:email.value.trim().toLowerCase(),whatsapp:whatsapp.value.trim(),status:'pendente',createdAt:serverTimestamp(),requestId:crypto.randomUUID()});m.className='mt-4 text-sm text-green-300';m.textContent='Solicitação enviada com sucesso. Aguarde a aprovação do seu acesso.';if(PAYMENT_URL&&!PAYMENT_URL.includes('COLOCAR_'))window.open(PAYMENT_URL,'_blank','noopener');else console.warn('Defina PAYMENT_URL em firebase-config.js.');pedido.reset()}catch(x){m.className='mt-4 text-sm text-red-300';m.textContent='Não foi possível enviar a solicitação. '+x.message}}</script></body></html>
