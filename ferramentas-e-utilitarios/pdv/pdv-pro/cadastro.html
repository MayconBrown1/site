<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV - Pro | Assinatura</title><script src="https://cdn.tailwindcss.com"></script><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#050505"><script src="./pwa-install.js"></script></head>
<body class="min-h-screen grid place-items-center bg-black p-5 text-white"><main class="w-full max-w-md rounded-2xl border border-[#3d3314] bg-zinc-950 p-7"><h1 class="text-3xl font-bold text-[#d4af37]">Assine o PDV - Pro</h1><p class="my-3 text-sm text-zinc-400">Sua conta será criada como pendente e ficará bloqueada até a aprovação. A senha é tratada apenas pelo Firebase Authentication.</p><form id="pedido" class="space-y-3"><input id="nome" required placeholder="Nome completo" class="w-full rounded bg-zinc-900 p-3"><input id="email" type="email" required placeholder="E-mail" class="w-full rounded bg-zinc-900 p-3"><input id="whatsapp" required placeholder="WhatsApp / telefone" class="w-full rounded bg-zinc-900 p-3"><input id="senha" type="password" minlength="6" required placeholder="Senha (mín. 6)" class="w-full rounded bg-zinc-900 p-3"><button class="w-full rounded bg-[#d4af37] p-3 font-bold text-black">ASSINAR AGORA</button></form><p id="m" class="mt-4 text-sm"></p><a href="login.html" class="mt-4 inline-block text-sm text-[#d4af37]">Voltar ao login</a></main><script type="module">import{auth,db,PAYMENT_URL}from'./firebase-config.js';import{createUserWithEmailAndPassword,signOut,deleteUser}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{doc,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const f=document.querySelector('#pedido'),m=document.querySelector('#m');f.onsubmit=async e=>{e.preventDefault();m.textContent='';let u;try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),senha.value);u=c.user;const b=writeBatch(db),r=doc(db,'accessRequests',crypto.randomUUID()),p=doc(db,'users',u.uid),base={name:nome.value.trim(),email:u.email.toLowerCase(),whatsapp:whatsapp.value.trim(),status:'pendente',createdAt:serverTimestamp()};b.set(r,{...base,requestId:r.id,uid:u.uid});b.set(p,{...base,role:'client',approvedAt:null,blockedAt:null});await b.commit();await signOut(auth);m.className='mt-4 text-sm text-green-300';m.textContent='Solicitação enviada com sucesso. Aguarde a aprovação do seu acesso.';if(PAYMENT_URL&&!PAYMENT_URL.includes('COLOCAR_'))window.open(PAYMENT_URL,'_blank','noopener');f.reset()}catch(x){if(u)try{await deleteUser(u)}catch(_){}m.className='mt-4 text-sm text-red-300';m.textContent=x.code==='auth/email-already-in-use'?'Este e-mail já possui uma solicitação ou conta.':x.message}}</script></body></html>
