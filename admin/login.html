<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Maycon Brown</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen px-4">
  <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <img src="/img/logo-brown-preto.png" class="w-40 mx-auto" alt="Logo Maycon Brown">
      <h1 class="text-2xl font-bold mt-4">Área Administrativa</h1>
      <p class="text-sm text-gray-400 mt-1">Digite seu e-mail e senha para entrar</p>
    </div>

    <div class="space-y-4">
      <input type="email" id="email" placeholder="E-mail" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input type="password" id="senha" placeholder="Senha" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="login" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded text-white font-bold transition">
        Entrar
      </button>
      <p id="erro" class="text-red-400 text-sm hidden"></p>
    </div>
  </div>

  <script type="module">
    import {
      createUserWithEmailAndPassword,
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import {
      getCatalogFirebaseApps,
      getPrimaryAdminApp
    } from "/software/assets/firebase.js";

    const auth = getAuth(getPrimaryAdminApp());
    const catalogApps = getCatalogFirebaseApps();
    const loginButton = document.getElementById("login");
    const errorElement = document.getElementById("erro");

    function getDestination() {
      const next = new URLSearchParams(location.search).get("next");
      return next && next.startsWith("/") && !next.startsWith("//")
        ? next
        : "/admin/index.html";
    }

    async function signInOrCreateCatalogUser(app, email, password) {
      const catalogAuth = getAuth(app);
      try {
        await signInWithEmailAndPassword(catalogAuth, email, password);
      } catch (signInError) {
        const canCreateMissingUser = [
          "auth/invalid-credential",
          "auth/user-not-found",
          "auth/wrong-password"
        ].includes(signInError.code);
        if (!canCreateMissingUser) throw signInError;

        try {
          await createUserWithEmailAndPassword(catalogAuth, email, password);
        } catch (createError) {
          await signOut(catalogAuth).catch(() => {});
          if (createError.code === "auth/email-already-in-use") {
            throw new Error(`A conta de ${email} já existe no projeto ${app.options.projectId}, mas usa outra senha. Redefina essa conta no Firebase Authentication para usar a mesma senha do acesso geral.`);
          }
          throw signInError;
        }
      }
    }

    async function submitLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("senha").value;
      errorElement.classList.add("hidden");

      if (!email || !password) {
        errorElement.textContent = "Informe o e-mail e a senha.";
        errorElement.classList.remove("hidden");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Entrando…";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginButton.textContent = "Preparando catálogos…";
        await Promise.all(catalogApps.map((app) => signInOrCreateCatalogUser(app, email, password)));
        window.location.replace(getDestination());
      } catch (error) {
        errorElement.textContent = error.message || "Não foi possível entrar.";
        errorElement.classList.remove("hidden");
        loginButton.disabled = false;
        loginButton.textContent = "Entrar";
      }
    }

    loginButton.addEventListener("click", submitLogin);
    document.getElementById("senha").addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitLogin();
    });
  </script>
</body>
</html>
